services:
  bible-api:
    build: .
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
    volumes:
      - .:/app
      - /app/node_modules
      - ./db:/app/db

  redis:
    image: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  redis-commander:
    image: rediscommander/redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8088:8081'

volumes:
  redis_data:
